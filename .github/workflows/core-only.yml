name: Build core so

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'

permissions:
  contents: write

jobs:
  core-so:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Build Go core (arm64-v8a, all sources)
        run: python scripts/build_native.py --platform android --abi arm64-v8a --all-sources
      - name: Exported symbols sanity
        run: |
          grep -c DuanjuRequest android/app/src/main/jniLibs/arm64-v8a/libduanju_core.so || true
      - uses: actions/upload-artifact@v4
        with:
          name: libduanju_core-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a/libduanju_core.so
          if-no-files-found: error
          retention-days: 14
